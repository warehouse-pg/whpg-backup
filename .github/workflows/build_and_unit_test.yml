name: build_and_unit_test

# This previously triggered on `master`, a branch this repository does not have,
# so it never ran on a push or a pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

# Same as live_suites: a new push to a pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Go release CI builds with, pinned here rather than read from go.mod: the
# go directive there is only the minimum the module needs, and a patch release
# below this still carries standard library vulnerabilities whpg-backup calls
# into. Keep in step with live_suites.yml.
env:
  GO_VERSION: '1.26.10'

jobs:

  build_and_unit_test:
    runs-on: ubuntu-latest
    # A normal run takes about two minutes.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        # The version stamped into the binaries is derived from git describe.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    # The Makefile requires GOPATH outright, and installs ginkgo into
    # $GOPATH/bin then invokes it by bare name, so both the variable and the bin
    # directory are needed. Go's own default location, rather than a path named
    # after the repository as before.
    - name: Set GOPATH
      run: |
        echo "GOPATH=$HOME/go" >> $GITHUB_ENV
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Dependencies
      run: make depend

    - name: Build
      run: make build

    - name: Vet
      run: go vet ./...

    - name: Unit Test
      run: make unit_all_gpdb_versions

